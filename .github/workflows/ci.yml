name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build ECCCDataExplorer.slnx --configuration Release
      - name: Test
        run: dotnet test --solution ECCCDataExplorer.slnx --configuration Release --no-build

  site:
    name: Site type-check, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the browser tests against the production build
        run: npm run test:e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7
